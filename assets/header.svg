<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="260" viewBox="0 0 1200 260" role="img" aria-labelledby="title desc">
  <title id="title">Pashtel</title>
  <desc id="desc">Cream, cherry and gold banner for a bakery storefront concept</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#FFF9EF"/><stop offset="1" stop-color="#F4E8D2"/></linearGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F5D36C"/><stop offset="1" stop-color="#D6A42D"/></linearGradient>
    <pattern id="dots" width="28" height="28" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1" fill="#7A2D45" opacity=".16"/></pattern>
  </defs>
  <rect width="1200" height="260" rx="18" fill="url(#bg)"/>
  <rect width="1200" height="260" rx="18" fill="url(#dots)"/>
  <g font-family="ui-monospace,SFMono-Regular,Menlo,Consolas,monospace">
    <text x="54" y="52" fill="#8B6B5F" font-size="15" letter-spacing="3">STOREFRONT STUDY · CATALOGUE / CHECKOUT</text>
    <text x="54" y="128" fill="#2B1713" font-size="54" font-weight="700">Pashtel<tspan fill="#B7335A">.</tspan></text>
    <text x="57" y="166" fill="#7A2D45" font-size="20">browse · choose · confirm</text>
    <text x="1018" y="52" fill="#B7335A" font-size="15">DEMO BUILD</text>
  </g>
  <g transform="translate(890 130)">
    <circle r="70" fill="url(#gold)" opacity=".88"/>
    <circle r="48" fill="none" stroke="#7A2D45" stroke-width="2" opacity=".35"/>
    <circle r="26" fill="#FFF9EF" opacity=".75"/>
    <path d="M-82 0H82M0-82V82" stroke="#B7335A" stroke-width="1" opacity=".2"/>
    <circle cx="70" cy="-26" r="5" fill="#B7335A"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="9s" repeatCount="indefinite"/></circle>
  </g>
  <rect x="1" y="1" width="1198" height="258" rx="17" fill="none" stroke="#D4C2A8" stroke-width="2"/>
</svg>
