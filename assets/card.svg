    <circle r="22" fill="#FFF5DE" opacity=".55"/>
    <circle cx="64" cy="-26" r="5" fill="#B7335A"><animateTransform attributeName="transform" type="rotate" from="0 0 0" to="360 0 0" dur="12s" repeatCount="indefinite"/></circle>
